<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Viatto Pay - Tu dinero seguro en Cartagena</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografía Google: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'viatto-night': '#061712', /* Verde Noche (Casi negro) */
            'viatto-mint': '#00FFA3',  /* Verde Menta Acento */
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Reseteo estricto para móvil nativo: sin rebotes ni scroll horizontal */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #061712;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ======================================================== */
    /* FONDO CIELO CON NUBES DESENFOCADAS (CSS PURO)            */
    /* Capa z-index: 1                                         */
    /* ======================================================== */
    .sky-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, #22acf3 0%, #38bdf8 35%, #7ed4fc 70%, #bae6fd 100%);
      overflow: hidden;
    }

    .cloud-layer {
      position: absolute;
      inset: -20px;
      filter: blur(32px);
      pointer-events: none;
      opacity: 0.95;
    }

    .cloud-blob {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.5) 48%, rgba(255, 255, 255, 0) 78%);
    }

    .cloud-1 {
      top: -8%;
      left: -15%;
      width: 280px;
      height: 220px;
      animation: cloudFloat1 20s ease-in-out infinite alternate;
    }

    .cloud-2 {
      top: 30%;
      right: -25%;
      width: 320px;
      height: 260px;
      animation: cloudFloat2 24s ease-in-out infinite alternate;
    }

    .cloud-3 {
      bottom: 12%;
      left: -10%;
      width: 320px;
      height: 240px;
      animation: cloudFloat1 18s ease-in-out infinite alternate-reverse;
    }

    .cloud-4 {
      top: 55%;
      left: 20%;
      width: 220px;
      height: 160px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.3) 40%, rgba(255, 255, 255, 0) 70%);
      animation: cloudFloat2 22s ease-in-out infinite alternate;
    }

    @keyframes cloudFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 15px) scale(1.08); }
    }

    @keyframes cloudFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-22px, -18px) scale(1.1); }
    }

    /* ======================================================== */
    /* CAPA DE STICKERS: Capa z-index: 10                       */
    /* Confinados al 100% del viewport sin provocar scroll      */
    /* ======================================================== */
    .stickers-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .sticker-item {
      position: absolute;
      top: 50%;
      left: 50%;
      object-fit: contain;
      opacity: 0;
      filter: blur(14px) drop-shadow(0 10px 16px rgba(6, 23, 18, 0.2));
      transform: translate(-50%, -50%) scale(0.1);
      transition: 
        left 1.8s cubic-bezier(0.16, 0.9, 0.28, 1.25),
        top 1.8s cubic-bezier(0.16, 0.9, 0.28, 1.25),
        opacity 1.1s ease-out,
        filter 1.6s ease-out;
      will-change: transform, left, top, opacity, filter;
    }

    /* Mojarra (Sticker 1): Tamaño destacado y posición cerca del copy */
    .sticker-mojarra {
      width: 125px;
      height: 125px;
      max-width: 32vw;
      max-height: 32vw;
      z-index: 12;
    }

    /* Stickers periféricos (2 al 10) */
    .sticker-peripheral {
      width: 66px;
      height: 66px;
      max-width: 18vw;
      max-height: 18vw;
    }

    /* Keyframes de Onda (Wave) y Flotación Continua */
    @keyframes waveFloatingA {
      0% {
        transform: translate(-50%, -50%) rotate(var(--rot));
        filter: blur(var(--base-blur, 0.5px)) drop-shadow(0 8px 14px rgba(6, 23, 18, 0.18));
      }
      25% {
        transform: translate(calc(-50% + 9px), calc(-50% - 12px)) rotate(calc(var(--rot) + 4deg));
        filter: blur(calc(var(--base-blur, 0.5px) + 0.6px)) drop-shadow(0 12px 18px rgba(6, 23, 18, 0.22));
      }
      50% {
        transform: translate(calc(-50% - 6px), calc(-50% - 18px)) rotate(calc(var(--rot) - 3deg));
        filter: blur(calc(var(--base-blur, 0.5px) + 1px)) drop-shadow(0 16px 22px rgba(6, 23, 18, 0.16));
      }
      75% {
        transform: translate(calc(-50% - 10px), calc(-50% - 7px)) rotate(calc(var(--rot) - 5deg));
        filter: blur(calc(var(--base-blur, 0.5px) + 0.4px)) drop-shadow(0 10px 15px rgba(6, 23, 18, 0.2));
      }
      100% {
        transform: translate(-50%, -50%) rotate(var(--rot));
        filter: blur(var(--base-blur, 0.5px)) drop-shadow(0 8px 14px rgba(6, 23, 18, 0.18));
      }
    }

    @keyframes waveFloatingB {
      0% {
        transform: translate(-50%, -50%) rotate(var(--rot));
        filter: blur(var(--base-blur, 0.5px)) drop-shadow(0 8px 14px rgba(6, 23, 18, 0.18));
      }
      25% {
        transform: translate(calc(-50% - 10px), calc(-50% + 11px)) rotate(calc(var(--rot) - 4deg));
        filter: blur(calc(var(--base-blur, 0.5px) + 0.6px)) drop-shadow(0 6px 12px rgba(6, 23, 18, 0.22));
      }
      50% {
        transform: translate(calc(-50% + 7px), calc(-50% + 17px)) rotate(calc(var(--rot) + 3deg));
        filter: blur(calc(var(--base-blur, 0.5px) + 0.9px)) drop-shadow(0 5px 10px rgba(6, 23, 18, 0.15));
      }
      75% {
        transform: translate(calc(-50% + 12px), calc(-50% + 5px)) rotate(calc(var(--rot) + 5deg));
        filter: blur(calc(var(--base-blur, 0.5px) + 0.3px)) drop-shadow(0 8px 14px rgba(6, 23, 18, 0.2));
      }
      100% {
        transform: translate(-50%, -50%) rotate(var(--rot));
        filter: blur(var(--base-blur, 0.5px)) drop-shadow(0 8px 14px rgba(6, 23, 18, 0.18));
      }
    }

    @keyframes waveMojarra {
      0% {
        transform: translate(-50%, -50%) rotate(var(--rot));
        filter: blur(var(--base-blur, 0.3px)) drop-shadow(0 10px 18px rgba(6, 23, 18, 0.24));
      }
      33% {
        transform: translate(calc(-50% + 7px), calc(-50% - 13px)) rotate(calc(var(--rot) + 4deg)) scale(1.02);
        filter: blur(calc(var(--base-blur, 0.3px) + 0.5px)) drop-shadow(0 14px 24px rgba(6, 23, 18, 0.2));
      }
      66% {
        transform: translate(calc(-50% - 7px), calc(-50% + 10px)) rotate(calc(var(--rot) - 3deg)) scale(0.99);
        filter: blur(calc(var(--base-blur, 0.3px) + 0.7px)) drop-shadow(0 8px 14px rgba(6, 23, 18, 0.26));
      }
      100% {
        transform: translate(-50%, -50%) rotate(var(--rot));
        filter: blur(var(--base-blur, 0.3px)) drop-shadow(0 10px 18px rgba(6, 23, 18, 0.24));
      }
    }

    .wave-anim-a { animation: waveFloatingA 5.2s ease-in-out infinite; }
    .wave-anim-b { animation: waveFloatingB 5.8s ease-in-out infinite; }
    .wave-anim-mojarra { animation: waveMojarra 5.5s ease-in-out infinite; }

    /* Pulso suave de Splash */
    @keyframes pulseSplash {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(0, 255, 163, 0.3)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(0, 255, 163, 0.6)); }
    }
    .splash-logo-pulse {
      animation: pulseSplash 2.2s ease-in-out infinite;
    }

    /* Botones con estilo táctil nativo */
    .btn-mobile-auth {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn-mobile-auth:active {
      transform: scale(0.98);
      opacity: 0.92;
    }
  </style>
</head>
<body class="bg-[#061712]">

  <!-- CONTENEDOR PRINCIPAL: NATIVO 100dvh SIN PHONE FRAMES -->
  <main class="relative w-full h-[100dvh] min-h-[100dvh] max-h-[100dvh] overflow-hidden flex flex-col justify-between" id="appMain">

    <!-- ======================================================== -->
    <!-- FASE 1: PANTALLA DE CARGA (SPLASH) - 0 a 3 SEGUNDOS      -->
    <!-- Ocupa el 100% de la pantalla, z-index: 50 (máxima prioridad)-->
    <!-- ======================================================== -->
    <div id="splashScreen" class="absolute inset-0 z-50 bg-[#061712] flex flex-col items-center justify-center px-6 transition-opacity duration-700 ease-out">
      
      <!-- Logo Centrado -->
      <div class="flex flex-col items-center justify-center space-y-6 splash-logo-pulse">
        <div class="w-44 h-32 flex items-center justify-center">
          <img 
            id="splashLogo" 
            src="LOGOS/logo.png" 
            onerror="this.onerror=null; this.src='LOGOS/LOGO.svg'; if(this.src.includes('LOGO.svg')) { this.onerror=function(){ this.src='LOGOS/ISOTIPO.svg'; } }"
            alt="Logo Viatto Pay" 
            class="max-w-full max-h-full object-contain"
          >
        </div>
      </div>

      <!-- Barra de progreso minimalista (3 segundos exactos) -->
      <div class="absolute bottom-10 w-32 h-1 bg-white/10 rounded-full overflow-hidden">
        <div id="splashProgressBar" class="h-full bg-[#00FFA3] rounded-full transition-all duration-[2900ms] ease-out w-0"></div>
      </div>
    </div>


    <!-- ======================================================== -->
    <!-- FONDO DE CIELO AZUL VIVO CON NUBES DESENFOCADAS (z-1)   -->
    <!-- ======================================================== -->
    <div class="sky-bg">
      <div class="cloud-layer">
        <div class="cloud-blob cloud-1"></div>
        <div class="cloud-blob cloud-2"></div>
        <div class="cloud-blob cloud-3"></div>
        <div class="cloud-blob cloud-4"></div>
      </div>
    </div>


    <!-- ======================================================== -->
    <!-- FASE 2: CAPA DE STICKERS (z-10)                          -->
    <!-- ======================================================== -->
    <div class="stickers-layer" id="stickersLayer">
      
      <!-- STICKER 1: LA MOJARRA (Grande, flotando arriba/centro cerca del copy) -->
      <img 
        src="STICKERS/1.png" 
        alt="Sticker 1 - La Mojarra" 
        class="sticker-item sticker-mojarra" 
        data-target-x="50%" 
        data-target-y="21%" 
        data-rotation="-7" 
        data-blur="0.3px" 
        data-anim="wave-anim-mojarra"
      >

      <!-- STICKERS 2 AL 10: Dispersión caótica periférica (dentro de márgenes seguros) -->
      <img src="STICKERS/2.png" alt="Sticker 2" class="sticker-item sticker-peripheral" data-target-x="14%" data-target-y="9%"  data-rotation="18"  data-blur="1.0px" data-anim="wave-anim-a">
      <img src="STICKERS/3.png" alt="Sticker 3" class="sticker-item sticker-peripheral" data-target-x="86%" data-target-y="8%"  data-rotation="-16" data-blur="0.6px" data-anim="wave-anim-b">
      <img src="STICKERS/4.png" alt="Sticker 4" class="sticker-item sticker-peripheral" data-target-x="10%" data-target-y="27%" data-rotation="14"  data-blur="0.8px" data-anim="wave-anim-a">
      <img src="STICKERS/5.png" alt="Sticker 5" class="sticker-item sticker-peripheral" data-target-x="90%" data-target-y="25%" data-rotation="-20" data-blur="1.2px" data-anim="wave-anim-b">
      <img src="STICKERS/6.png" alt="Sticker 6" class="sticker-item sticker-peripheral" data-target-x="8%"  data-target-y="45%" data-rotation="-10" data-blur="0.5px" data-anim="wave-anim-b">
      <img src="STICKERS/7.png" alt="Sticker 7" class="sticker-item sticker-peripheral" data-target-x="92%" data-target-y="44%" data-rotation="18"  data-blur="1.0px" data-anim="wave-anim-a">
      <img src="STICKERS/8.png" alt="Sticker 8" class="sticker-item sticker-peripheral" data-target-x="12%" data-target-y="65%" data-rotation="-14" data-blur="0.8px" data-anim="wave-anim-a">
      <img src="STICKERS/9.png" alt="Sticker 9" class="sticker-item sticker-peripheral" data-target-x="88%" data-target-y="63%" data-rotation="15"  data-blur="0.4px" data-anim="wave-anim-b">
      <img src="STICKERS/10.png" alt="Sticker 10" class="sticker-item sticker-peripheral" data-target-x="50%" data-target-y="6%"  data-rotation="-18" data-blur="1.4px" data-anim="wave-anim-b">
    </div>


    <!-- ======================================================== -->
    <!-- FASE 3: INTERFAZ DE REGISTRO (z-30)                      -->
    <!-- Garantiza que los textos y botones JAMÁS queden ocultos  -->
    <!-- ======================================================== -->
    <div id="registrationUI" class="relative z-30 flex flex-col justify-between h-full px-6 pt-10 pb-6 opacity-0 transition-opacity duration-1000 ease-out pointer-events-none">
      
      <!-- Espacio superior compensado para la Mojarra -->
      <div class="h-28 flex-shrink-0"></div>

      <!-- BLOQUE CENTRAL (TEXTOS - z-30) -->
      <div class="flex flex-col items-center text-center my-auto px-1">
        
        <!-- TÍTULO HERO RESPONSIVE PARA MÓVIL (text-2xl a text-3xl) -->
        <h1 class="text-[27px] sm:text-3xl font-black tracking-tight text-[#061712] leading-[1.12] mb-3 uppercase">
          EVITE PAGAR MOJARRAS A 500 MIL
        </h1>

        <!-- SUBTÍTULO -->
        <p class="text-[15px] sm:text-base font-semibold text-[#061712]/90 leading-snug max-w-[320px]">
          Tu dinero seguro en Cartagena con Viatto Pay.
        </p>

      </div>

      <!-- BLOQUE INFERIOR (BOTONES DE AUTENTICACIÓN) -->
      <div class="flex flex-col items-center w-full space-y-3 pb-safe">
        
        <!-- TEXTO LEGAL -->
        <p class="text-[10px] text-center text-[#061712]/75 leading-tight px-2 font-normal max-w-[340px]">
          Al autenticarte y crear una cuenta, aceptas el Acuerdo de Usuario, la Política de Privacidad y el Consentimiento E-SIGN aplicables al uso de los servicios.
        </p>

        <!-- BOTÓN 1: INICIAR SESIÓN CON APPLE (FONDO NEGRO) -->
        <button type="button" class="btn-mobile-auth w-full h-[50px] bg-black text-white font-medium rounded-2xl flex items-center justify-center space-x-3 shadow-lg active:scale-95 transition-transform">
          <!-- Icono Apple SVG -->
          <svg class="w-5 h-5 fill-current mb-0.5" viewBox="0 0 170 170">
            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.59-7.71-11.72-14-4.88-7.4-8.88-15.6-12-24.62-3.12-9.01-4.68-17.76-4.68-26.25 0-14.82 4.13-27.18 12.38-37.07 8.25-9.9 18.55-14.93 30.9-15.09 4.35 0 9.24 1.11 14.67 3.35 5.43 2.24 9.17 3.35 11.22 3.35 1.7 0 5.67-1.19 11.91-3.57 6.24-2.38 11.47-3.35 15.69-2.92 11.64 1.18 20.94 5.92 27.91 14.22-10.42 6.36-15.52 14.98-15.3 25.86.22 8.64 3.49 15.93 9.8 21.87 6.31 5.94 13.88 9.54 22.71 10.8-2.39 7.08-5.33 14.49-8.82 22.23zM119.22 32.64c0-7.23 2.66-14.08 7.98-20.55 5.32-6.47 11.87-10.66 19.65-12.57.11 1.08.16 2.06.16 2.92 0 7.12-2.82 14.07-8.46 20.85-5.64 6.78-12.44 10.9-20.4 12.36-.21-1.08-.32-2.09-.32-3.01z"/>
          </svg>
          <span class="text-[15px] font-semibold tracking-wide">Iniciar Sesión con Apple</span>
        </button>

        <!-- BOTÓN 2: INICIAR SESIÓN CON GOOGLE (FONDO NEGRO CON ÍCONO A COLOR) -->
        <button type="button" class="btn-mobile-auth w-full h-[50px] bg-black text-white font-medium rounded-2xl flex items-center justify-center space-x-3 shadow-lg active:scale-95 transition-transform">
          <!-- Icono Google SVG Oficial a Color -->
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>

            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span class="text-[15px] font-semibold tracking-wide">Iniciar Sesión con Google</span>
        </button>

        <!-- ACCESO ALTERNATIVO -->
        <div class="pt-0.5">
          <a href="#login-phone" class="text-sm font-semibold text-[#061712] hover:text-black transition-colors underline-offset-4 hover:underline">
            Número de teléfono
          </a>
        </div>

      </div>

    </div>

  </main>

  <!-- ======================================================== -->
  <!-- JAVASCRIPT: SECUENCIA DE FASES (3 SEGUNDOS EXACTOS)      -->
  <!-- ======================================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const splashScreen = document.getElementById('splashScreen');
      const splashProgressBar = document.getElementById('splashProgressBar');
      const registrationUI = document.getElementById('registrationUI');
      const stickers = document.querySelectorAll('.sticker-item');
      const appMain = document.getElementById('appMain');

      // Iniciar barra de carga con duración de 3 segundos
      setTimeout(() => {
        if (splashProgressBar) splashProgressBar.style.width = '100%';
      }, 50);

      // Fallback estilizado si algún sticker no carga
      stickers.forEach((img) => {
        img.onerror = function() {
          this.onerror = null;
          const svgFallback = encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
              <rect width="70" height="70" x="5" y="5" rx="18" fill="#061712" stroke="#00FFA3" stroke-width="2.5"/>
              <text x="40" y="47" fill="#00FFA3" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">★</text>
            </svg>
          `);
          this.src = `data:image/svg+xml;utf8,${svgFallback}`;
        };
      });

      // Configurar estado inicial de todos los stickers en el centro con desenfoque
      stickers.forEach((sticker) => {
        sticker.style.left = '50%';
        sticker.style.top = '50%';
        sticker.style.transform = 'translate(-50%, -50%) scale(0.1)';
        sticker.style.opacity = '0';
        sticker.style.filter = 'blur(16px)';
      });

      // ===================================================================
      // FASE 1 -> FASE 2: A LOS 3 SEGUNDOS EXACTOS (3000ms)
      // ===================================================================
      setTimeout(() => {
        // Fade-out suave de pantalla de carga
        splashScreen.style.opacity = '0';
        splashScreen.style.pointerEvents = 'none';

        // Ocultar totalmente el Splash para no bloquear la pantalla en móviles
        setTimeout(() => {
          splashScreen.style.display = 'none';
        }, 700);

        // FASE 2: Animación de salida de stickers desde el centro
        animateStickersFromCenter();

        // FASE 3: Fade-in de la interfaz principal una vez posicionados
        setTimeout(() => {
          registrationUI.style.opacity = '1';
          registrationUI.style.pointerEvents = 'auto';
        }, 900);

      }, 3000); // 3 segundos exactos

      // Dispersión de stickers desde el centro
      function animateStickersFromCenter() {
        stickers.forEach((sticker, index) => {
          const targetX = sticker.getAttribute('data-target-x') || '50%';
          const targetY = sticker.getAttribute('data-target-y') || '50%';
          const targetRotation = sticker.getAttribute('data-rotation') || '0';
          const targetBlur = sticker.getAttribute('data-blur') || '0.5px';
          const animClass = sticker.getAttribute('data-anim') || 'wave-anim-a';

          // Salida orgánica
          const delay = index === 0 ? 0 : 60 + (index * 55);

          setTimeout(() => {
            sticker.style.opacity = '1';
            sticker.style.left = targetX;
            sticker.style.top = targetY;
            sticker.style.setProperty('--rot', `${targetRotation}deg`);
            sticker.style.setProperty('--base-blur', targetBlur);
            
            sticker.style.filter = `blur(${targetBlur}) drop-shadow(0 10px 16px rgba(6, 23, 18, 0.2))`;
            sticker.style.transform = `translate(-50%, -50%) scale(1) rotate(${targetRotation}deg)`;

            // Al posicionarse, arrancar la onda continua
            setTimeout(() => {
              sticker.classList.add(animClass);
            }, 1800);

          }, delay);
        });
      }

      // Parallax sutil con soporte táctil y de movimiento sin romper overflow
      let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

      appMain.addEventListener('mousemove', (e) => {
        const rect = appMain.getBoundingClientRect();
        targetX = ((e.clientX - rect.left) / rect.width - 0.5) * 12;
        targetY = ((e.clientY - rect.top) / rect.height - 0.5) * 12;
      });

      appMain.addEventListener('mouseleave', () => {
        targetX = 0;
        targetY = 0;
      });

      // Detección suave de giroscopio en móviles compatibles
      if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', (e) => {
          if (e.gamma !== null && e.beta !== null) {
            targetX = Math.max(-10, Math.min(10, (e.gamma / 45) * 8));
            targetY = Math.max(-10, Math.min(10, ((e.beta - 45) / 45) * 8));
          }
        });
      }

      function parallaxLoop() {
        mouseX += (targetX - mouseX) * 0.08;
        mouseY += (targetY - mouseY) * 0.08;

        stickers.forEach((sticker, idx) => {
          const depth = idx === 0 ? 0.65 : (0.25 + ((idx % 3) * 0.2));
          const px = mouseX * depth;
          const py = mouseY * depth;
          sticker.style.setProperty('--px', `${px}px`);
          sticker.style.setProperty('--py', `${py}px`);
        });

        requestAnimationFrame(parallaxLoop);
      }
      parallaxLoop();

    });
  </script>
</body>
</html>
